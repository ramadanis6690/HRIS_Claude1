# /etc/nginx/sites-available/hris  →  ln -s ke sites-enabled, lalu: nginx -t && systemctl reload nginx
# Ganti hris.GANTI-DOMAIN di semua tempat. Sertifikat: Let's Encrypt (certbot) atau CA korporat.

# Pembatasan laju (PERMINTAAN_IT §4). Login dan aksi lain lewat endpoint yang sama
# (POST /api), jadi batasnya per alamat IP untuk seluruh /api; penguncian akun
# setelah 5 gagal (AUTH-05) ditegakkan aplikasi.
limit_req_zone $binary_remote_addr zone=hris_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name hris.GANTI-DOMAIN;
    # Hanya pengalihan ke HTTPS dan perpanjangan sertifikat.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hris.GANTI-DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/hris.GANTI-DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hris.GANTI-DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;   # foto presensi ±70 KB, dokumen maks 7 MB

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

    # Tampilan statis (design §2.1): hasil npm run build.
    root /opt/hris/dist/client;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /api {
        limit_req zone=hris_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://nominatim.openstreetmap.org; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri /index.html;
    }
}
